name: Daily scan

on:
  schedule:
    # 22:00 UTC on weekdays = 6pm ET in summer, 5pm ET in winter.
    # Always after the 4pm close, so the last bar is complete.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the CSV back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy pyarrow curl_cffi

      # No price cache. scan.py does a full 2-year pull every run, on purpose —
      # the incremental cache path failed silently three separate times and each
      # failure wrote a confident, well-formed, wrong file. A few extra minutes
      # of download is cheaper than trading off stale data.

      - name: Run the scan
        run: python scan.py

      # Only runs if the scan succeeded. scan.py exits non-zero on stale data,
      # a thin final bar, or partial universe coverage — so a red run means
      # "don't trust today's file", not "the job is broken".
      - name: Commit the results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scan_universe.csv scan_candidates.csv
          # dated copy, named by the DATA date so a stale file can't overwrite a
          # good one and history stays honest
          ASOF=$(python -c "import pandas as pd; print(pd.read_csv('scan_universe.csv')['asof_date'].iloc[0])")
          mkdir -p history
          cp scan_universe.csv "history/${ASOF}.csv"
          git add history
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan ${ASOF}"
            git push
          fi
