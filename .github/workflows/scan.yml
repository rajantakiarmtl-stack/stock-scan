name: Daily scan

on:
  schedule:
    # 22:00 UTC on weekdays = 6pm ET in summer, 5pm ET in winter.
    # Always after the 4pm close, so the last bar is complete.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the CSV back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas numpy pyarrow curl_cffi

      # Keeps the price cache between runs so each day only tops up.
      # If it misses, scan.py just does a full pull — nothing breaks.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: scan_prices.parquet
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the scan
        run: python scan.py

      - name: Commit the results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scan_universe.csv scan_candidates.csv
          # also keep a dated copy so history is inspectable
          mkdir -p history
          cp scan_universe.csv "history/$(date -u +%Y-%m-%d).csv"
          git add history
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "scan $(date -u +%Y-%m-%d)"
            git push
          fi
